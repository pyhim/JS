<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 03</title>

    <style>
        .form-group {
            margin: 4px;
        }

        .form-group label {
            width: 75px;
            display: inline-block;
        }
        
        table#localStorageTable, th, tr, td {
            border: 1px solid black;
            font-size: 22px;
        }
    </style>
</head>

<body>
    <form name="writeForm">
        <div class="form-group">
            <label>Ключ</label>
            <input type="text" name="keyInput" required>
        </div>
        <div class="form-group">
            <label>Значение</label>
            <input type="text" name="valueInput" required>
        </div>
        <div class="form-group">
            <input type="submit" value="Запись">
        </div>
    </form>
    <br>
    <form name="readForm">
        <div class="form-group">
            <label>Ключ</label>
            <input type="text" name="keyInput" required>
        </div>
        <div class="form-group">
            <input type="submit" value="Чтение">
        </div>
    </form>
    <span>
        <label for="showAll"></label>
        <button id="showAll">Show All</button>
        <label for="clear"></label>
        <button id="clear">Clear</button>
    </span>
    <table id="localStorageTable">
        <thead>
        <tr>
            <th>Key</th>
            <th>Value</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <script>
        /*
        Задание:
        Добавьте на страницу кнопку "Показать все". При клике по этой кнопке на странице
        должна появится или обновляется таблица с содержимым localStorrage. Первая колонка таблицы - ключ, вторая - значение.
        
        Добавьте на страницу кнопку "Очистить localStorage". При нажатии на кнопку localStorage должен быть очищен.
        */
        const table = document.getElementById('localStorageTable');
        const clearButton = document.querySelector('button#clear');
        const showAllButton = document.querySelector('button#showAll');
        
        function addRow() {
            if (arguments.length !== 2) return;
            
            let tableRowAssembly = document.createElement('tr');
            
            for (let arg of arguments) {
                let cell = tableRowAssembly.insertCell();
                cell.innerHTML = arg;
            }
            
            table.querySelector('tbody').appendChild(tableRowAssembly);
        }
        
        clearButton.addEventListener('click', () => {
            table.querySelector('tbody').querySelectorAll('tr').forEach((row) => row.remove());
            
            localStorage.clear()
        });
        
        showAllButton.addEventListener('click', () => {
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                
                addRow(key, localStorage.getItem(key));
            }
        });
        
        document.forms.writeForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const form = document.forms.writeForm;

            let key = form.keyInput.value;
            let value = form.valueInput.value;

            localStorage.setItem(key, value); 
            form.reset();
        });

        document.forms.readForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const form = document.forms.readForm;
            let key = form.keyInput.value;

            let value = localStorage.getItem(key); 
            alert(value);
        });
    </script>
</body>

</html>
