<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 04</title>
</head>

<body>
<div id="root">
  <table class="json-table">
    <thead>
    <tr>
      <th>Id</th>
      <th>Title</th>
      <th>Completed</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
</div>
<script>
    /*
    Задание:
    Напишите сценарий, который выполняет GET запрос по адресу https://jsonplaceholder.typicode.com/todos
    И выводит содержимое ответа в виде таблицы.
    */
    const root = document.getElementById('root');
    const tableBody = root.querySelector(".json-table").querySelector('tbody');
    
    const keys = ['id', 'title', 'completed'];

    fetch("https://jsonplaceholder.typicode.com/todos")
        .then(res => res.json())
        .then(json => {
            const size = 3;
            
            for (const todo of json) {
                const row = document.createElement("tr");
                tableBody.append(row);
                
                for (const key of keys) {
                    const cell = row.insertCell();
                    cell.innerHTML = todo[key];
                }
            }
        });
</script>
</body>

</html>
