<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 02</title>
</head>

<body>
<div id="info">
  <div>
    <label for="id">ID: </label>
    <span id="id">1</span>
  </div>
  <div>
    <label for="userId">UserID: </label>
    <span id="userId">1</span>
  </div>
</div>
<form id="mainForm">
  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title">
  </div>
  <div class="form-group">
    <label for="body">Body</label>
    <input type="text" id="body">
  </div>
  <div class="form-group">
    <label for="send"></label>
    <button type="submit" id="send">Send</button>
    <label for="update"></label>
    <button id="update">Update</button>
  </div>
</form>
<div id="status"></div>
<script>
    /*
    Задание:
    Напишите сценарий, который будет обновлять сущность post со свойствами
    id: 1,
    title: 'foo',
    body: 'bar',
    userId: 1,

    Создайте форму с полем ввода для значения свойства title и полем ввода для значения свойства body

    Значения для свойств title и body получите от пользователя
    Значения id и userId должны остаться равными 1 и выводить их в форме не нужно.
    При загрузке сценария заполните форму данными получеными при обработке GET запроса на https://jsonplaceholder.typicode.com/posts/1

    адрес для отправки запроса
    https://jsonplaceholder.typicode.com/posts/1

    для обновления сущности воспользуйтесь PUT запросом https://jsonplaceholder.typicode.com/posts/1. Обработайте ответ
    и выведите информацию о ошибке или об успешно завершенной операции.
    */
    
    const getURL = "https://jsonplaceholder.typicode.com/posts/1";
    const postURL = "https://jsonplaceholder.typicode.com/posts";
    const title = document.querySelector("#title");
    const body = document.querySelector("#body");
    const form = document.querySelector("#mainForm");
    const statusDiv = document.querySelector("#status");
    const updateBtn = document.querySelector("#update");

    const responseCodes = {
        '101': "Switching Protocol",
        '200': "OK",
        '201': "Created",
        '301': "Moved Permanently",
        '302': "Found",
        '404': "Not Found",
        '500': "Internal Server Error",
        '501': "Not Implemented"
    };
    
    fetch(getURL)
        .then(res => res.json())
        .then(json => {
            title.value = json.title;
            body.value = json.body;
        });
    
    function printStatus(status) {
        statusDiv.innerHTML = responseCodes[status.toString()];
    }
    
    form.addEventListener("submit", e => {
        e.preventDefault();
        
        let task = {
            "userId": 1,
            "title": title.value,
            "body": body.value
        };
        
        fetch(postURL, {
            method: "POST",
            body: JSON.stringify(task),
            headers: {
                'Content-type': 'application/json; charset=UTF-8',
            }
        })
            .then(res => {
                printStatus(res.status);
                return res.json();
            })
            .then(json => console.log(json))
    });
    
    updateBtn.addEventListener("click", e => {
        e.preventDefault();

        let task = {
            "userId": 1,
            "title": title.value,
            "body": body.value
        };

        fetch(getURL, {
            method: "PUT",
            body: JSON.stringify(task),
            headers: {
                'Content-type': 'application/json; charset=UTF-8',
            }
        })
            .then(res => {
                printStatus(res.status);
                return res.json();
            })
            .then(json => console.log(json))
    });
</script>
</body>

</html>
